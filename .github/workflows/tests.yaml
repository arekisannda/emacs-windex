name: Windex tests
on: [push, pull_request]
jobs:
  test-windex-states:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        emacs-version:
          - 30.1
          - 30.2
    steps:
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - uses: actions/checkout@v2
      - name: Emacs version
        run: |
          emacs --version
      - name: Run windex tests
        run: |
          make test-windex
